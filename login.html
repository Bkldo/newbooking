<!DOCTYPE html>
<html lang="th" dir="ltr" class="smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico">
  <title>เข้าสู่ระบบ - ระบบจองห้องประชุม</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="skin/fonts.css">
  <link rel="stylesheet" href="skin/gcss.css">
  <link rel="stylesheet" href="skin/booking/style.css">
  
  <!-- JavaScript -->
  <script src="js/gajax.js"></script>
  <script src="js/common.js"></script>
  <script src="app.js"></script>
</head>

<body class="responsive">
  <div id="slidemenu_content">
    <div class="wrapper bg_image bg_color" id="toTop">
      <header class="header" id="scroll-to">
        <div class="menu_wrapper menu_bg">
          <nav id="topmenu" class="topmenu slidemenu">
            <ul id="menu-container">
              <li class="home"><a href="index.html"><span>หน้าหลัก</span></a></li>
              <li class="login"><a href="login.html"><span>เข้าสู่ระบบ</span></a></li>
            </ul>
          </nav>
        </div>
        <a id="dark_mode" class="icon-contrast" title="Dark mode"></a>
      </header>
      
      <div class="gcss-wrapper center">
        <div id="logo" class="logo_color">
          <h1><a href="index.html" title="ระบบจองห้องประชุม" class="icon-calendar">ระบบจองห้องประชุม</a></h1>
          <h4>ระบบจองห้องประชุม พร้อมปฏิทินการจอง</h4>
        </div>
      </div>
      
      <div id="skip" class="gcss-wrapper clear">
        <main id="content" class="border-color">
            <article id=login_div>
              <form id=login_frm method=post autocomplete=off onsubmit="App.login(event)">
                <h3><span class="icon-signin">เข้าสู่ระบบ</span></h3>
                <aside class="center" id="login-error" style="color:red; display:none;"></aside>
                <fieldset>
                  <label class="g-input icon-user">
                    <input type=text name=username id=login_username maxlength=255 placeholder="ชื่อผู้ใช้" title="ชื่อผู้ใช้" required autofocus>
                  </label>
                  <label class="g-input icon-password">
                    <input class=showpassword type=password name=password id=login_password maxlength=50 placeholder="รหัสผ่าน" title="รหัสผ่าน" required>
                  </label>
                </fieldset>
                <fieldset class="accept_term">
                  <label><input type=checkbox name=login_remember id=login_remember value="1">จดจำการเข้าระบบ</label>
                  <button type=submit class="button login wide">เข้าสู่ระบบ</button>
                </fieldset>
              </form>
            </article>
        </main>
      </div>
    </div>
    <footer class="footer">
      <p class="copy">
        Copyright 2023 © สำนักงานเขตบางคอแหลม <small>Migrated to Static HTML + Google Sheets</small>
      </p>
    </footer>
  </div>
  <a href="#scroll-to" class="scroller" title="scroll to top">^</a>
</body>

</html>
