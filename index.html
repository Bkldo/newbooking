<!DOCTYPE html>
<html lang="th" dir="ltr" class="smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico">
  <title>ระบบจองห้องประชุม</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="skin/fonts.css">
  <link rel="stylesheet" href="skin/gcss.css">
  <link rel="stylesheet" href="skin/booking/style.css">
  
  <!-- JavaScript -->
  <script src="js/gajax.js"></script>
  <script src="js/common.js"></script>
  <script src="js/calendar.js"></script>
  <script src="app.js"></script>

  <style>
    /* CSS เพิ่มเติมสำหรับการทำ SPA */
    .hidden { display: none !important; }
  </style>
</head>

<body class="responsive">
  <div id="slidemenu_content">
    <div class="wrapper bg_image bg_color" id="toTop">
      <header class="header" id="scroll-to">
        <div class="menu_wrapper menu_bg">
          <nav id="topmenu" class="topmenu slidemenu">
            <ul id="menu-container">
              <li class="home"><a href="#home"><span>หน้าหลัก</span></a></li>
              <li class="booking hidden" id="menu-booking"><a href="#booking-rooms"><span>จองห้องประชุม</span></a></li>
              <li class="report hidden" id="menu-report"><a href="#booking-report"><span>รายงานการจอง</span></a></li>
              <li class="member hidden" id="menu-member"><a href="#member"><span>รายชื่อสมาชิก</span></a></li>
              <li class="login" id="menu-login"><a href="login.html"><span>เข้าระบบ</span></a></li>
              <li class="logout hidden" id="menu-logout"><a href="#" onclick="App.logout()"><span>ออกจากระบบ</span></a></li>
            </ul>
          </nav>
        </div>
        <a id="dark_mode" class="icon-contrast" title="Dark mode"></a>
      </header>
      
      <div class="gcss-wrapper center">
        <div id="logo" class="logo_color">
          <h1><a href="index.html" title="ระบบจองห้องประชุม" class="icon-calendar">ระบบจองห้องประชุม</a></h1>
          <h4>ระบบจองห้องประชุม พร้อมปฏิทินการจอง</h4>
        </div>
      </div>
      
      <div id="skip" class="gcss-wrapper clear">
        <main id="content" class="border-color">
          <!-- เนื้อหาหลักจะถูกโหลดมาใส่ตรงนี้ด้วย JS -->
          <div id="main-content">
            <div style="text-align: center; padding: 50px;">
              <h2>กำลังโหลดข้อมูล...</h2>
            </div>
          </div>
        </main>
      </div>
    </div>
    <footer class="footer">
      <p class="copy">
        Copyright 2023 © สำนักงานเขตบางคอแหลม <small>Migrated to Static HTML + Google Sheets</small>
      </p>
    </footer>
  </div>
  <a href="#scroll-to" class="scroller" title="scroll to top">^</a>
  
  <!-- Template สำหรับหน้าปฏิทิน (Home) -->
  <template id="tpl-home">
    <div class="setup_frm">
      <!-- ส่วน Dashboard -->
      <section>
        <header><h3 class="icon-dashboard">Dashboard</h3></header>
        <div class="dashboard clear">
          <div class="card card-1" style="width: 50%; float: left; padding-right: 10px; box-sizing: border-box;">
            <a class="card-item bg-blue" href="#booking-rooms">
              <span class="card-subitem icon-calendar">การจองวันนี้</span>
              <span class="card-subitem" id="dash-today">0</span>
              <span class="card-subitem">จองห้อง</span>
            </a>
          </div>
          <div class="card card-2" style="width: 50%; float: left; padding-left: 10px; box-sizing: border-box;">
            <a class="card-item bg-olive" href="#booking-rooms">
              <span class="card-subitem icon-office">ห้องทั้งหมด</span>
              <span class="card-subitem" id="dash-rooms">0</span>
              <span class="card-subitem">ห้องประชุม</span>
            </a>
          </div>
        </div>
      </section>

      <!-- ส่วน ปฏิทิน -->
      <section style="margin-top: 20px;">
        <header><h3 class="icon-calendar">ปฏิทินการจอง ห้องประชุม</h3></header>
        <div class="setup_frm">
          <div id="booking-calendar"></div>
          <div id="room_links" class="calendar_links clear">
            <!-- ลิงก์ห้องจะถูกเพิ่มที่นี่ -->
          </div>
        </div>
      </section>
    </div>
  </template>

  <!-- Template สำหรับฟอร์มจอง -->
  <!-- Template สำหรับหน้ารายการห้องประชุม (Room List) -->
  <template id="tpl-booking-rooms">
    <section>
      <header><h1 class="icon-office">ห้องประชุม</h1></header>
      <div id="room-list-container" class="setup_frm clear">
        <!-- รายการห้องประชุมจะถูกโหลดมาใส่ตรงนี้ -->
        <div style="text-align: center; padding: 20px;">กำลังโหลดข้อมูลห้องประชุม...</div>
      </div>
    </section>
  </template>

  <!-- Template สำหรับฟอร์มจอง -->
  <template id="tpl-booking-form">
    <section>
      <header><h1 class="icon-write">จองห้องประชุม</h1></header>
      <form id="booking-form" class="setup_frm" onsubmit="App.submitBooking(event)">
        <fieldset>
          <legend><span>รายละเอียดการจอง</span></legend>
          <div class="item">
            <label for="room_id">ห้องประชุม</label>
            <span class="g-input icon-office">
              <select name="room_id" id="room_id" required>
                <option value="">เลือกห้องประชุม</option>
              </select>
            </span>
          </div>
          <div class="item">
            <label for="topic">หัวข้อการประชุม</label>
            <span class="g-input icon-edit">
              <input type="text" name="topic" id="topic" required>
            </span>
          </div>
          <div class="item">
            <label for="attendees">จำนวนผู้เข้าร่วม (คน)</label>
            <span class="g-input icon-users">
              <input type="number" name="attendees" id="attendees" required>
            </span>
          </div>
          <div class="item">
            <label for="department">แผนกที่จอง</label>
            <span class="g-input icon-category">
              <select name="department" id="department" required>
                <option value="">เลือกแผนก</option>
                <option value="1">บริหาร</option>
                <option value="2">บุคคล</option>
                <option value="3">ไอที</option>
                <option value="4">บัญชี</option>
              </select>
            </span>
          </div>
          <div class="item">
            <label for="purpose">วัตถุประสงค์</label>
            <span class="g-input icon-category">
              <select name="purpose" id="purpose" required>
                <option value="">เลือกวัตถุประสงค์</option>
                <option value="1">ประชุมภายใน</option>
                <option value="2">ประชุมกับลูกค้า</option>
                <option value="3">อบรมพนักงาน</option>
              </select>
            </span>
          </div>
          <div class="item">
            <label for="begin">เวลาเริ่ม</label>
            <span class="g-input icon-clock">
              <input type="datetime-local" name="begin" id="begin" required>
            </span>
          </div>
          <div class="item">
            <label for="end">เวลาสิ้นสุด</label>
            <span class="g-input icon-clock">
              <input type="datetime-local" name="end" id="end" required>
            </span>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>อุปกรณ์ที่ต้องการ</span></legend>
          <div class="item" id="equipment-list">
             <!-- จะสร้าง Checkbox อัตโนมัติด้วย JS หรือ Hardcode ไว้ก่อนได้ -->
             <label><input type="checkbox" name="equipment" value="1"> โปรเจคเตอร์</label><br>
             <label><input type="checkbox" name="equipment" value="2"> ไมโครโฟน</label><br>
             <label><input type="checkbox" name="equipment" value="3"> น้ำดื่ม</label>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>ข้อมูลผู้ติดต่อ</span></legend>
          <div class="item">
            <label for="contact_name">ผู้ติดต่อ</label>
            <span class="g-input icon-user">
              <input type="text" name="contact_name" id="contact_name" readonly>
            </span>
          </div>
          <div class="item">
            <label for="contact_phone">เบอร์โทรศัพท์</label>
            <span class="g-input icon-phone">
              <input type="text" name="contact_phone" id="contact_phone">
            </span>
          </div>
          <div class="item">
            <label for="comment">หมายเหตุเพิ่มเติม</label>
            <span class="g-input icon-file">
              <textarea name="comment" id="comment" rows="3"></textarea>
            </span>
          </div>
        </fieldset>
        <fieldset class="submit">
          <button type="submit" class="button save large icon-save">บันทึก</button>
          <button type="button" class="button cancel large icon-cancel" onclick="App.navigate('home')">ยกเลิก</button>
        </fieldset>
      </form>
    </section>
  </template>

  <!-- Template สำหรับหน้ารายงาน/อนุมัติการจอง -->
  <template id="tpl-booking-report">
    <section>
      <header><h1 class="icon-report">รายงานการจองห้องประชุม</h1></header>
      <div class="tablebody">
        <table class="data fullwidth">
          <thead>
            <tr>
              <th>หัวข้อ</th>
              <th>ห้องประชุม</th>
              <th>ผู้จอง</th>
              <th>วันเวลาที่เริ่ม</th>
              <th>วันเวลาที่สิ้นสุด</th>
              <th>สถานะ</th>
              <th class="center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="report-list-container">
            <tr>
              <td colspan="7" class="center">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <!-- Template สำหรับรายชื่อสมาชิก -->
  <template id="tpl-member">
    <section>
      <header><h1 class="icon-users">รายชื่อสมาชิก</h1></header>
      <div class="tablebody">
        <table class="data fullwidth">
          <thead>
            <tr>
              <th>ชื่อ-นามสกุล</th>
              <th>ชื่อผู้ใช้</th>
              <th>เบอร์โทรศัพท์</th>
              <th>สถานะ</th>
              <th class="center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="member-list-container">
            <tr>
              <td colspan="5" class="center">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <!-- Template สำหรับฟอร์มแก้ไขโปรไฟล์ -->
  <template id="tpl-editprofile">
    <section>
      <header><h1 class="icon-edit">แก้ไขข้อมูลสมาชิก</h1></header>
      <form id="editprofile-form" class="setup_frm" onsubmit="App.submitProfileEdit(event)">
        <input type="hidden" name="id" id="edit_id">
        <fieldset>
          <legend><span>ข้อมูลส่วนตัว</span></legend>
          <div class="item">
            <label for="edit_name">ชื่อ-นามสกุล</label>
            <span class="g-input icon-user">
              <input type="text" name="name" id="edit_name" required>
            </span>
          </div>
          <div class="item">
            <label for="edit_phone">เบอร์โทรศัพท์</label>
            <span class="g-input icon-phone">
              <input type="text" name="phone" id="edit_phone">
            </span>
          </div>
          <div class="item" id="status-group">
            <label for="edit_status">สถานะสมาชิก</label>
            <span class="g-input icon-star0">
              <select name="status" id="edit_status">
                <option value="0">สมาชิกทั่วไป</option>
                <option value="1">ผู้ดูแลระบบ</option>
              </select>
            </span>
          </div>
        </fieldset>
        <fieldset class="submit">
          <button type="submit" class="button save large icon-save">บันทึก</button>
          <button type="button" class="button cancel large icon-cancel" onclick="App.navigate('member')">ยกเลิก</button>
        </fieldset>
      </form>
    </section>
  </template>

  <script>
    (function() {
      var initApp = function() {
        if (typeof App !== 'undefined') {
          try {
            App.init();
          } catch(e) {
            console.error("App.init failed:", e);
            document.getElementById('main-content').innerHTML = '<h3 style="color:red;text-align:center;">เกิดข้อผิดพลาดในการโหลดระบบ (App.init)</h3><p style="text-align:center;">กรุณากด Ctrl+F5 เพื่อรีเฟรช</p>';
          }
        } else {
          document.getElementById('main-content').innerHTML = '<h3 style="color:red;text-align:center;">ไม่พบไฟล์ app.js</h3><p style="text-align:center;">กรุณากด Ctrl+F5 เพื่อรีเฟรชแคชของเบราว์เซอร์</p>';
        }
      };

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>

</html>
